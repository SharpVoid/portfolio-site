name: Diagnose Pages SSL

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check HTTPS certificate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/pages \
            --jq '{
              status,
              cname,
              protected_domain_state,
              pending_domain_unverified_at,
              https_certificate,
              https_enforced
            }'
      - name: Check authoritative DNS
        run: |
          for server in ns1.reg.ru ns2.reg.ru; do
            echo "=== $server: CAA UDP ==="
            dig @"$server" lisenkomisha.ru CAA +time=5 +tries=1 || true

            echo "=== $server: CAA TCP ==="
            dig @"$server" lisenkomisha.ru CAA +tcp +time=5 +tries=1 || true
          done
